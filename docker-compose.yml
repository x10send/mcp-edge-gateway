services:
  mcp-edge-gateway:
    build: .
    container_name: mcp-edge-gateway
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8788:8788"
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ${GATEWAY_CONFIG_DIR:-./config}:/config:ro
      - ${GATEWAY_STATE_DIR:-./state}:/config/state
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8788/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
